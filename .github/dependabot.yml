# One pull request per ecosystem and month, against develop like every other change, so a pinned
# action or a locked package never goes stale unseen. Security updates still come at once. The
# examples/ projects are left out: each one follows the release of Nexy it shows.
version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: uv
    directory: /
    target-branch: develop
    schedule:
      interval: monthly
    groups:
      python:
        patterns: ["*"]

  - package-ecosystem: npm
    directories: [/extensions/vscode, /tests/client]
    target-branch: develop
    schedule:
      interval: monthly
    groups:
      # A major release of a JavaScript tool (TypeScript, ESLint, Babel) changes how the code
      # builds: each one comes in its own pull request, and the rest stays in one.
      javascript:
        patterns: ["*"]
        update-types: [minor, patch]
