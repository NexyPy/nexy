name: E2E

# The browser suite is slow and boots a real dev stack (uvicorn + Vite +
# Chromium), so it is not part of the fast quality matrix. It still has to
# run somewhere: a suite that never executes rots silently.

on:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * *"
  push:
    branches: [main]
  # A pull request that can break the dev stack gets the suite before the merge; one that only
  # changes the docs does not boot Chromium.
  pull_request:
    paths:
      - "nexy/**"
      - "tests/e2e/**"
      - "tests/conftest.py"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/e2e.yml"

# A newer push to a pull request makes its older run useless; a push to main and the nightly run
# each finish.
concurrency:
  group: e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  browser:
    name: Browser E2E (Playwright, real dev stack)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.13"

      - name: Install deps (locked)
        run: uv sync --frozen --group dev

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 9

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Install Chromium
        run: uv run --no-sync playwright install --with-deps chromium

      - name: Run E2E suite
        run: uv run --no-sync python -m pytest tests/ -m e2e --tb=short
