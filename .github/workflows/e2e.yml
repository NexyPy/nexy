name: E2E

# The browser suite is slow and boots a real dev stack (uvicorn + Vite +
# Chromium), so it is not part of the fast quality matrix. It still has to
# run somewhere: a suite that never executes rots silently.

on:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * *"
  push:
    branches: [main, V2]

jobs:
  browser:
    name: Browser E2E (Playwright, real dev stack)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          python-version: "3.13"

      - name: Install deps (locked)
        run: uv sync --frozen --group dev

      - uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2 # v4.0.0
        with:
          version: 9

      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22

      - name: Install Chromium
        run: uv run --no-sync playwright install --with-deps chromium

      - name: Run E2E suite
        run: uv run --no-sync python -m pytest tests/ -m e2e --tb=short
