name: CI

on:
  push:
    branches: [main, develop, V2]
  pull_request:
    branches: [main, develop, V2]

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]

    env:
      UV_PYTHON: ${{ matrix.python-version }}

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          python-version: ${{ matrix.python-version }}

      # Reproducible install: everything comes from the committed uv.lock.
      # Any drift between pyproject.toml and uv.lock fails this step.
      - name: Install deps (locked)
        run: uv sync --frozen --group dev

      - name: Lint (nexy + tests)
        run: uv run --no-sync ruff check nexy/ tests/

      - name: Format
        run: uv run --no-sync ruff format nexy/ tests/ --check

      - name: Typecheck
        run: uv run --no-sync python -m mypy nexy --strict

      - name: Test
        run: uv run --no-sync python -m pytest tests/ --tb=short

      - name: Test coverage (floor enforced by fail_under)
        run: uv run --no-sync python -m pytest tests/ --cov=nexy --cov-report=term-missing

      - name: Security (bandit, zero findings)
        run: uv run --no-sync python -m bandit -r nexy/ -c .bandit

      # Dependency audit runs against the lock snapshot, including dev tools
      # (attackers reach contributors too); the project itself is excluded
      # because "nexy" is not on PyPI. The one ignore is documented in
      # SECURITY.md ("Dependency audit register").
      - name: Dependency audit (pip-audit)
        run: |
          uv export --frozen --no-emit-project --format requirements.txt -o requirements-audit.txt
          uv run --no-sync pip-audit -r requirements-audit.txt --disable-pip --strict \
            --ignore-vuln PYSEC-2022-252

  build:
    name: Build distributions
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          python-version: "3.13"
          enable-cache: false

      # Build exactly what a release would publish: no local path sources.
      - name: Build sdist and wheel
        run: uv build --no-sources

      - name: Smoke test wheel
        run: |
          uv run --isolated --no-project --with dist/*.whl python - <<'PY'
          import nexy
          from pathlib import Path
          from nexy.__version__ import __version__

          root = Path(nexy.__file__).parent
          assert (root / "modules/cli/templates/web-fbr").is_dir()
          print(__version__)
          PY

      - name: Smoke test source distribution
        run: |
          uv run --isolated --no-project --with dist/*.tar.gz python - <<'PY'
          import nexy
          from pathlib import Path
          from nexy.__version__ import __version__

          root = Path(nexy.__file__).parent
          assert (root / "modules/cli/templates/web-fbr").is_dir()
          print(__version__)
          PY

      - name: Upload distributions
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          retention-days: 7
          if-no-files-found: error

  extension:
    name: VS Code extension (build + typecheck + lint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extensions/vscode

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2 # v4.0.0
        with:
          version: 9

      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: extensions/vscode/pnpm-lock.yaml

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run check-types

      - name: Lint
        run: pnpm run lint

      - name: Production esbuild bundle
        run: pnpm run package
