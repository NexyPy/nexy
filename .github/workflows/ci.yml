name: CI

on:
  push:
    branches: [main, develop, V2]
  pull_request:
    branches: [main, develop, V2]

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]

    env:
      UV_PYTHON: ${{ matrix.python-version }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: ${{ matrix.python-version }}

      # Reproducible install: everything comes from the committed uv.lock.
      # Any drift between pyproject.toml and uv.lock fails this step.
      - name: Install deps (locked)
        run: uv sync --frozen --group dev

      # tests/client mounts the generated runtimes in jsdom with Node.js: without its packages
      # those tests cannot even start.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/client/package-lock.json

      - name: Install the client test dependencies (locked)
        run: npm ci --no-audit --no-fund --prefix tests/client

      - name: Lint (nexy + tests + sites)
        run: uv run --no-sync ruff check nexy/ tests/ sites/

      - name: Format
        run: uv run --no-sync ruff format nexy/ tests/ sites/ --check

      - name: Typecheck
        run: uv run --no-sync python -m mypy nexy --strict

      - name: Test
        run: uv run --no-sync python -m pytest tests/ --tb=short

      - name: Test coverage (floor enforced by fail_under)
        run: uv run --no-sync python -m pytest tests/ --cov=nexy --cov-report=term-missing

      - name: Security (bandit, zero findings)
        run: uv run --no-sync python -m bandit -r nexy/ -c .bandit

      # Dependency audit runs against the lock snapshot, including dev tools
      # (attackers reach contributors too); the project itself is excluded
      # because "nexy" is not on PyPI. The one ignore is documented in
      # SECURITY.md ("Dependency audit register").
      - name: Dependency audit (pip-audit)
        run: |
          uv export --frozen --no-emit-project --format requirements.txt -o requirements-audit.txt
          uv run --no-sync pip-audit -r requirements-audit.txt --disable-pip --strict \
            --ignore-vuln PYSEC-2022-252

  attribution:
    name: Commit attribution
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # GitHub treats every Co-authored-by trailer as a contributor, so an AI
      # trailer adds a bot to the contributor graph permanently. Check only the
      # commits this push or PR introduces.
      - name: Reject AI attribution in new commits
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -n "$BASE" ] && git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            python scripts/check_attribution.py --range "${BASE}..HEAD"
          else
            python scripts/check_attribution.py --range "HEAD~1..HEAD"
          fi

  build:
    name: Build distributions
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: "3.13"
          enable-cache: false

      # Build exactly what a release would publish: no local path sources.
      - name: Build sdist and wheel
        run: uv build --no-sources

      # -I keeps the checkout's own nexy/ folder off sys.path, so the installed package is the one tested.
      - name: Smoke test wheel
        run: |
          uv run --isolated --no-project --with dist/*.whl python -I - <<'PY'
          import nexy
          from pathlib import Path
          from nexy.__version__ import __version__

          root = Path(nexy.__file__).parent
          assert (root / "modules/cli/templates/web-fbr").is_dir()
          assert (root / "skills/nexy-principles/SKILL.md").is_file()
          print(__version__)
          PY

      - name: Smoke test source distribution
        run: |
          uv run --isolated --no-project --with dist/*.tar.gz python -I - <<'PY'
          import nexy
          from pathlib import Path
          from nexy.__version__ import __version__

          root = Path(nexy.__file__).parent
          assert (root / "modules/cli/templates/web-fbr").is_dir()
          assert (root / "skills/nexy-principles/SKILL.md").is_file()
          print(__version__)
          PY

      - name: Upload distributions
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          retention-days: 7
          if-no-files-found: error

  extension:
    name: VS Code extension (build + typecheck + lint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extensions/vscode

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@d9184bf108216479bc5a137cc391f4d7b14c870b # v6.1.0
        with:
          version: 9

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: extensions/vscode/pnpm-lock.yaml

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run check-types

      - name: Lint
        run: pnpm run lint

      - name: Production esbuild bundle
        run: pnpm run package
