name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install deps
        run: uv pip install -e ".[dev]"

      - name: Lint
        run: ruff check nexy/

      - name: Format
        run: ruff format nexy/ --check

      - name: Typecheck
        run: python -m mypy nexy --strict

      - name: Test
        run: python -m pytest tests/ -v --tb=short

      - name: Test coverage
        run: python -m pytest tests/ --cov=nexy --cov-report=term-missing
