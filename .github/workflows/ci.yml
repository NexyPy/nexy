name: CI

on:
  push:
    # A pushed fix/feature branch gets a run of its own: a failure should not have to
    # wait for a pull request before it shows up.
    branches:
      - main
      - develop
      - "feature/**"
      - "fix/**"
      - "docs/**"
      - "perf/**"
  pull_request:
    branches: [main, develop]

# A new push to the same ref makes the previous run obsolete. A push and the
# pull_request it also triggers stay in separate groups: the `gate` job decides
# which of the two runs the matrix.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  # A pushed branch that an open pull request already covers must not run the matrix
  # twice. The pull_request run is the one the PR shows, so the push run steps aside;
  # a push without a PR keeps its run. The integration branches always run: a PR from
  # develop to main must not silence the CI of develop itself. Empty on a
  # pull_request run, where the gate is skipped, and `needs.<skipped job>.outputs` is
  # then an empty string.
  gate:
    name: Decide whether a push runs
    if: github.event_name == 'push' && !contains(fromJSON('["main","develop"]'), github.ref_name)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      run: ${{ steps.open.outputs.count == '0' }}

    steps:
      - id: open
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          count=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$GITHUB_REF_NAME" \
            --state open --json number --jq 'length')
          echo "count=${count}" >> "$GITHUB_OUTPUT"

  quality:
    needs: gate
    # always(): a skipped `gate` is a pushed branch covered by no PR, and GitHub would
    # otherwise skip this job too, leaving a PR with no matrix at all.
    if: always() && needs.gate.outputs.run != 'false'
    runs-on: ubuntu-latest
    strategy:
      # A failure on 3.15 must not cancel the runs of 3.12, 3.13 and 3.14: four
      # answers, or the red says nothing about the versions that passed.
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14", "3.15"]

    env:
      UV_PYTHON: ${{ matrix.python-version }}

    steps:
      # The whole history: the diff coverage gate diffs against the merge base of the PR.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: ${{ matrix.python-version }}

      # Reproducible install: everything comes from the committed uv.lock.
      # Any drift between pyproject.toml and uv.lock fails this step.
      - name: Install deps (locked)
        run: uv sync --frozen --group dev

      # tests/client mounts the generated runtimes in jsdom with Node.js: without its packages
      # those tests cannot even start.
      - uses: pnpm/action-setup@d9184bf108216479bc5a137cc391f4d7b14c870b # v6.1.0
        with:
          version: 9

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: tests/client/pnpm-lock.yaml

      - name: Install the client test dependencies (locked)
        run: pnpm install --frozen-lockfile --dir tests/client

      - name: Lint (nexy + tests + sites + scripts)
        run: uv run --no-sync ruff check nexy/ tests/ sites/ scripts/

      - name: Format
        run: uv run --no-sync ruff format nexy/ tests/ sites/ scripts/ --check

      - name: Typecheck
        run: uv run --no-sync python -m mypy nexy --strict

      # sites/ and scripts/ are not part of the package, so they get their own strict
      # pass; sites/shared/docs_source.py still has findings and stays out of it.
      - name: Typecheck (sites/shared/social, COM scripts)
        run: |
          uv run --no-sync python -m mypy sites/shared/social \
            scripts/publish_social.py scripts/make_com_media.py \
            scripts/check_diff_coverage.py --strict

      # The posts of COM/ are checked like code: a number without a dated proof,
      # a caption over a network's limit, a card that is the wrong shape, all fail.
      - name: Posts (COM/)
        run: uv run --no-sync python scripts/publish_social.py --check

      # One run of the suite, with coverage: the floor of pyproject.toml (fail_under) and the
      # diff coverage gate read the same report.
      - name: Test and coverage (floor enforced by fail_under)
        run: |
          uv run --no-sync python -m pytest tests/ --tb=short --cov=nexy \
            --cov-report=term-missing:skip-covered --cov-report=json:.coverage.json

      # Every line a PR adds to nexy/ runs in a test, and every branch it opens is taken.
      - name: Diff coverage (every added line runs in a test)
        if: github.event_name == 'pull_request'
        run: |
          uv run --no-sync python scripts/check_diff_coverage.py \
            --base "origin/${{ github.base_ref }}" --report .coverage.json

      - name: Security (bandit, zero findings)
        run: uv run --no-sync python -m bandit -r nexy/ -c .bandit

      # Dependency audit runs against the lock snapshot, including dev tools
      # (attackers reach contributors too); the project itself is excluded
      # because "nexy" is not on PyPI. The one ignore is documented in
      # SECURITY.md ("Dependency audit register").
      # The script retries a dropped connection to PyPI, never an advisory: the bare pip-audit
      # step failed a run on a timeout or a reset several times a day.
      - name: Dependency audit (pip-audit)
        run: uv run --no-sync python scripts/audit_dependencies.py

  # Windows is where users first met #75 (a wheel missing for Windows) and #330 (a fresh Vue
  # project that does not start): one Python version, the unit suite, and that start.
  windows:
    name: Windows (3.13)
    needs: gate
    if: always() && needs.gate.outputs.run != 'false'
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      UV_PYTHON: "3.13"
      NEXY_LANG: en
      PYTHONUTF8: "1"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: "3.13"

      - name: Install deps (locked)
        run: uv sync --frozen --group dev

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      # The ubuntu image ships the browser the COM media tests draw with; windows-latest does not.
      - name: Install the headless browser of Playwright
        run: uv run --no-sync python -m playwright install chromium-headless-shell

      - name: Unit tests
        run: uv run --no-sync python -m pytest tests/unit --tb=short -q -p no:cacheprovider

      # The path of #330: a new Vue project, started by the nexy of this branch. Vite's own
      # output is printed whatever happens, since it holds the cause of a failed start.
      - name: A new Vue project starts
        if: always()
        shell: pwsh
        run: |
          $nx = Join-Path $PWD ".venv\Scripts\nx.exe"
          & $nx new demo -t web-fbr-vue --no-agents
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Set-Location demo
          $out = Join-Path $PWD "dev.out.log"
          $err = Join-Path $PWD "dev.err.log"
          $server = Start-Process -FilePath $nx -ArgumentList "dev" -PassThru -NoNewWindow `
            -RedirectStandardOutput $out -RedirectStandardError $err
          $status = 0
          foreach ($i in 1..90) {
            Start-Sleep -Seconds 1
            try {
              $status = (Invoke-WebRequest -Uri "http://localhost:3000/" -UseBasicParsing -TimeoutSec 5).StatusCode
              break
            } catch { }
            if ($server.HasExited) { break }
          }
          Write-Output "--- nexy dev output"
          Get-Content $out, $err -ErrorAction SilentlyContinue
          Stop-Process -Id $server.Id -Force -ErrorAction SilentlyContinue
          if ($status -ne 200) { Write-Output "error: GET / answered $status"; exit 1 }
          Write-Output "GET / answered 200"

  attribution:
    name: Commit attribution
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # GitHub treats every Co-authored-by trailer as a contributor, so an AI
      # trailer adds a bot to the contributor graph permanently. Check only the
      # commits this push or PR introduces.
      - name: Reject AI attribution in new commits
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -n "$BASE" ] && git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            python scripts/check_attribution.py --range "${BASE}..HEAD"
          else
            python scripts/check_attribution.py --range "HEAD~1..HEAD"
          fi

  build:
    name: Build distributions
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: "3.13"
          enable-cache: false

      # Build exactly what a release would publish: no local path sources.
      - name: Build sdist and wheel
        run: uv build --no-sources

      # -I keeps the checkout's own nexy/ folder off sys.path, so the installed package is the one tested.
      - name: Smoke test wheel
        run: |
          uv run --isolated --no-project --with dist/*.whl python -I - <<'PY'
          import nexy
          from pathlib import Path
          from nexy.__version__ import __version__

          root = Path(nexy.__file__).parent
          assert (root / "modules/cli/templates/web-fbr").is_dir()
          assert (root / "skills/nexy-principles/SKILL.md").is_file()
          print(__version__)
          PY

      - name: Smoke test source distribution
        run: |
          uv run --isolated --no-project --with dist/*.tar.gz python -I - <<'PY'
          import nexy
          from pathlib import Path
          from nexy.__version__ import __version__

          root = Path(nexy.__file__).parent
          assert (root / "modules/cli/templates/web-fbr").is_dir()
          assert (root / "skills/nexy-principles/SKILL.md").is_file()
          print(__version__)
          PY

      - name: Upload distributions
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          retention-days: 7
          if-no-files-found: error

  extension:
    name: VS Code extension (build + typecheck + lint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extensions/vscode

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@d9184bf108216479bc5a137cc391f4d7b14c870b # v6.1.0
        with:
          version: 9

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: extensions/vscode/pnpm-lock.yaml

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run check-types

      - name: Lint
        run: pnpm run lint

      - name: Production esbuild bundle
        run: pnpm run package
