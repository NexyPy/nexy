name: CI

on:
  push:
    branches: [main, develop, V2]
  pull_request:
    branches: [main, develop, V2]

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v4.2.2

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install deps
        run: uv pip install -e . --group dev

      - name: Lint
        run: ruff check nexy/

      - name: Format
        run: ruff format nexy/ --check

      - name: Typecheck
        run: python -m mypy nexy --strict

      - name: Test
        run: python -m pytest tests/ -v --tb=short

      - name: Test coverage
        run: python -m pytest tests/ --cov=nexy --cov-report=term-missing

      - name: Security (bandit)
        run: python -m bandit -r nexy/ -c .bandit --exit-zero
