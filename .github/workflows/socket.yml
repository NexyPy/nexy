name: Socket

on:
  push:
    branches:
      - main
      - develop
    paths:
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/socket.yml"
  # Before the merge too: a compromised package in a lock update is caught on its pull request.
  pull_request:
    branches:
      - main
      - develop
    paths:
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/socket.yml"
  schedule:
    - cron: "37 6 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  firewall:
    name: Dependency firewall
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.9"

      - name: Install Socket Firewall
        uses: socketdev/action@ba6de6cc0565af1f42295590380973573297e31f # v1.3.2
        with:
          mode: firewall

      - name: Install dependencies through the firewall
        run: sfw uv sync --frozen --group dev
