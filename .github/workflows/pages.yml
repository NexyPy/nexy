name: Docs site

# Builds the vanilla docs site (sites/vanilla) from docs/ and publishes it with GitHub Pages.
# One-time setup: Settings > Pages > Source: "GitHub Actions".

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "sites/shared/**"
      - "sites/vanilla/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build the site
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: "3.13"

      # cmarkgfm and pygments come from the committed uv.lock, like in CI.
      - name: Install deps (locked)
        run: uv sync --frozen --no-dev

      # Gives the folder the site is served from, such as /nexy for a project page.
      - id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      # Links between pages are relative; only 404.html needs the base, because GitHub shows it
      # at the address that failed, whatever its depth. The site URL is the address the site is
      # published at: the canonical tags, the Open Graph cards and the sitemap are absolute.
      - name: Build
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
          SITE_URL: ${{ steps.pages.outputs.base_url }}
        run: >-
          uv run --no-sync python sites/vanilla/build.py _site
          --base "$BASE_PATH" --site-url "$SITE_URL"

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    name: Publish
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
