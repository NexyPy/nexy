name: Assign

# Issues and pull requests stay unassigned. An assignee reads as taken, so a
# contributor must be able to see what is free. The `/take` command still gives
# a good first issue to whoever asks for it.
#
# The job name stays `Give it an owner` because branch protection requires the
# check. pull_request_target, not pull_request: a pull request from a fork gets a
# read-only token there, and the check needs no write.
on:
  issues:
    types: [opened, reopened]
  pull_request_target:
    types: [opened, reopened]

permissions: {}

jobs:
  assign:
    name: Give it an owner
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Leave the issue or pull request unassigned
        run: echo "No automatic assignment."
