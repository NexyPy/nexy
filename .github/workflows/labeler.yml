name: Labeler

# A pull request gets the area labels of the files it changes (.github/labeler.yml), so
# `gh pr list --label area:router` answers without anyone clicking.
#
# pull_request_target, not pull_request: a pull request from a fork gets a read-only token there,
# and labelling needs write. The action reads the list of changed files from the API; no code from
# the pull request is checked out or run, so the target context is safe here.
on:
  pull_request_target:
    types: [opened, reopened, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    name: Label the areas it changes
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0
