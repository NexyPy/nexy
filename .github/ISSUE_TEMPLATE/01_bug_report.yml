name: Bug Report
description: Report a reproducible bug or regression in Nexy
title: "Bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please check it on the latest Nexy release first:
        it may already be fixed. A bug we can run gets fixed much faster, so the link to a minimal
        reproduction is required.
   - type: textarea
    id: info
    attributes:
      label: Environment (`nx info`)
      description: Run `nx info` in your project directory and paste the output here.
      placeholder: |
        Nexy        2.6.4
        Python      3.13.1 (CPython)
        OS          Linux 6.8 x86_64
        Node        22.18.0
        Package     pnpm 9.15.9
        Router      file-based
        Frameworks  react 19.2.0
      render: text
    validations:
      required: true
     
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of the bug.
      placeholder: What happened? What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Run `nx n` to create a project
        2. Set client framework to React
        3. Run `nx dev`
        4. See error
    validations:
      required: true

  - type: input
    id: reproduction_link
    attributes:
      label: Link to a minimal reproduction
      description: |
        A public GitHub repository made with `nx new`, holding only what triggers the bug.
        Not a localhost link, not your whole app. An issue we cannot reproduce may be closed.
      placeholder: https://github.com/you/nexy-bug
    validations:
      required: true

  - type: dropdown
    id: frequency
    attributes:
      label: How often does it happen?
      description: Following your steps, how easily does the bug come back?
      options:
        - Every time
        - Often
        - Sometimes
        - Only once
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      description: Copy and paste any relevant terminal output. This will be automatically formatted.
      render: shell

  - type: textarea
    id: config
    attributes:
      label: Configuration
      description: If relevant, paste your `nexyconfig.py` file.
      render: python

  - type: checkboxes
    id: checks
    attributes:
      label: Validation
      options:
        - label: I have searched existing issues and this is not a duplicate.
          required: true
        - label: I have provided clear steps to reproduce the issue.
          required: true
