<svg xmlns="http://www.w3.org/2000/svg" width="720" height="336" viewBox="0 0 720 336" role="img" aria-labelledby="scope-title" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
  <title id="scope-title">A request for /blog/2024/hello is answered by the deepest error page</title>
  <style>
    svg { --ink: #0a0a0a; --muted: #6b6b6b; --line: #e0e0e0; --soft: #f5f5f5; --accent: #0a9d8f; }
    @media (prefers-color-scheme: dark) {
      svg { --ink: #fafafa; --muted: #a3a3a3; --line: #3a3a3a; --soft: #141414; --accent: #3fe0c8; }
    }
  </style>

  <!-- The request and the answer it will get. -->
  <rect x="0" y="0" width="720" height="46" fill="var(--soft)" stroke="var(--line)"/>
  <text x="18" y="29" font-size="13.5" style="fill: var(--ink)">GET /blog/2024/hello</text>
  <text x="702" y="29" font-size="13.5" text-anchor="end" style="fill: var(--accent)">404</text>

  <!-- The chain of candidates, shallowest first. -->
  <path d="M34 58 v18 M28 71 l6 6 l6 -6" fill="none" stroke="var(--muted)" stroke-width="1.4"/>

  <g>
    <rect x="0" y="86" width="720" height="60" fill="none" stroke="var(--line)"/>
    <text x="20" y="112" font-size="13" style="fill: var(--ink)">src/routes/notfound.nexy</text>
    <text x="20" y="133" font-size="11.5" style="fill: var(--muted)">scope /</text>
    <text x="700" y="122" font-size="11" text-anchor="end" letter-spacing="1.2" style="fill: var(--muted)">MATCHES</text>
  </g>

  <g>
    <rect x="0" y="158" width="720" height="60" fill="none" stroke="var(--line)"/>
    <text x="20" y="184" font-size="13" style="fill: var(--ink)">src/routes/blog/notfound.nexy</text>
    <text x="20" y="205" font-size="11.5" style="fill: var(--muted)">scope /blog</text>
    <text x="700" y="194" font-size="11" text-anchor="end" letter-spacing="1.2" style="fill: var(--muted)">MATCHES</text>
  </g>

  <g>
    <rect x="0" y="230" width="720" height="60" fill="none" stroke="var(--accent)" stroke-width="2"/>
    <rect x="20" y="252" width="10" height="10" style="fill: var(--accent)"/>
    <text x="42" y="262" font-size="13" style="fill: var(--ink)">src/routes/blog/2024/notfound.nexy</text>
    <text x="42" y="283" font-size="11.5" style="fill: var(--muted)">scope /blog/2024</text>
    <text x="700" y="266" font-size="11" text-anchor="end" letter-spacing="1.2" style="fill: var(--accent)">ANSWERS</text>
  </g>

  <text x="0" y="320" font-size="11.5" style="fill: var(--muted)">Delete the last file and /blog answers. Delete that one and the built-in page answers.</text>
</svg>
