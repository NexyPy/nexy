<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>$title - Nexy</title>
<meta name="description" content="$description">
<link rel="icon" href="$root/assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="$root/assets/style.css">
<script>
  try {
    var saved = localStorage.getItem("nexy-docs-theme");
    var dark = saved ? saved === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
    document.documentElement.dataset.theme = dark ? "dark" : "light";
  } catch (e) { document.documentElement.dataset.theme = "light"; }
</script>
</head>
<body data-root="$root" data-search="$root/search-index.json">
<header class="top">
  <button class="icon-button menu" aria-label="Open the menu" aria-expanded="false">$icon_menu</button>
  <a class="brand" href="$home">
    <span class="logo" aria-hidden="true">$mark</span><span class="name">Nexy</span><span class="tag">Docs</span>
  </a>
  <span class="spacer"></span>
  <button class="search-open" aria-label="Search the docs">
    $icon_search<span>Search the docs</span><kbd>Ctrl K</kbd>
  </button>
  <a class="icon-button" href="https://github.com/NexyPy/nexy" aria-label="Nexy on GitHub">$icon_github</a>
  <button class="icon-button theme" aria-label="Switch between light and dark">$icon_sun$icon_moon</button>
</header>
<div class="frame">
  <nav class="side" aria-label="Documentation">$nav</nav>
  <main class="page">
    <article class="doc">
      <p class="crumb">$section</p>
      $article
      <p class="source"><a href="$source">Edit this page on GitHub</a></p>
      $pager
    </article>
  </main>
  <aside class="toc" aria-label="On this page">$toc</aside>
</div>
<div class="scrim" hidden></div>
<dialog class="search" aria-label="Search">
  <form method="dialog"><input type="search" placeholder="Search the docs" aria-label="Search the docs" autocomplete="off"></form>
  <ul class="results" role="listbox"></ul>
  <p class="hint">Enter opens the result, Esc closes.</p>
</dialog>
<script src="$root/assets/site.js" defer></script>
</body>
</html>
