<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>$title - Nexy</title>
<meta name="description" content="$description">
<meta name="theme-color" content="#0a0a0a">
$router_meta
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&family=Geist+Mono:wght@100..900&display=swap" rel="stylesheet">
<link rel="icon" href="$root/assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="$root/assets/style.css">
<script>
  try {
    var saved = localStorage.getItem("nexy-docs-theme");
    var dark = saved ? saved === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
    document.documentElement.dataset.theme = dark ? "dark" : "light";
  } catch (e) { document.documentElement.dataset.theme = "light"; }
  // The menu shows the docs of one router: the page's own, else the one chosen, else file-based.
  try {
    var own = document.querySelector('meta[name="nexy-router"]');
    document.documentElement.dataset.router =
      (own && own.content) || localStorage.getItem("nexy-docs-router") || "fbr";
  } catch (e) { document.documentElement.dataset.router = "fbr"; }
</script>
</head>
<body data-root="$root" data-search="$root/search-index.json"$home_attr>
<a class="skip" href="#content">Skip to content</a>
<div class="top">
  <header class="topbar">
    <span class="topbar-lines" aria-hidden="true"></span>
    <button class="menu" type="button" aria-label="Open the menu" aria-expanded="false">$icon_menu</button>
    <a class="brand" href="$home" aria-label="Nexy, home">
      <img class="brand-logo" src="$root/assets/nexy.svg" alt="Nexy">
    </a>
    <div class="top-actions">
      <nav class="top-links" aria-label="Sections">
        <a href="$link_start">Start</a>
        <a href="$link_build">Build</a>
        <a href="$link_choose">Choose</a>
        <a href="$link_reference">Reference</a>
      </nav>
      <button class="search-open" type="button" aria-label="Search the docs">
        $icon_search<span>Search the docs</span><kbd>Ctrl K</kbd>
      </button>
      <a class="cta" href="https://github.com/NexyPy/nexy#readme" target="_blank" rel="noopener noreferrer">$icon_book<span>Docs</span></a>
      <button class="theme-switch" type="button" role="switch" aria-checked="false" aria-label="Switch between light and dark" data-theme-toggle>
        <span class="theme-knob">$icon_sun$icon_moon</span>
      </button>
    </div>
    <span class="progress" aria-hidden="true"></span>
  </header>
</div>
<div class="frame">
  <nav class="side" aria-label="Documentation">$nav</nav>
  <main class="page" id="content" tabindex="-1">
    <article class="$article_class">
      <p class="crumb"><a href="$home">Docs</a><span aria-hidden="true">/</span>$section</p>
      $article
      <p class="source">
        <button class="copy-page" type="button" data-markdown="index.md">Copy page as Markdown</button>
        <a href="$source">Edit on GitHub</a>
      </p>
      $pager
    </article>
  </main>
  <aside class="toc" aria-label="On this page">$toc</aside>
</div>
<div class="scrim" hidden></div>
<dialog class="search" aria-label="Search">
  <form method="dialog"><input type="search" placeholder="Search the docs" aria-label="Search the docs" autocomplete="off"></form>
  <ul class="results" role="listbox"></ul>
  <p class="hint">Enter opens the result, Esc closes.</p>
</dialog>
<script src="$root/assets/site.js" defer></script>
</body>
</html>
