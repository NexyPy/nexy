<!doctype html>
<html lang="$lang" dir="$dir" data-lang="$lang">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>$title - Nexy</title>
$seo
<meta name="theme-color" content="#0a0a0a">
$router_meta
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&family=Geist+Mono:wght@100..900&display=swap" rel="stylesheet">
<link rel="icon" href="$root/assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="$root/assets/style.css">
<script>
  try {
    var saved = localStorage.getItem("nexy-docs-theme");
    var dark = saved ? saved === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
    document.documentElement.dataset.theme = dark ? "dark" : "light";
  } catch (e) { document.documentElement.dataset.theme = "light"; }
  // The menu starts folded when the reader folded it last time.
  try {
    if (localStorage.getItem("nexy-docs-side") === "closed") document.documentElement.dataset.side = "closed";
  } catch (e) {}
  // The routing groups of one router: the page's own, else the one chosen last, else FBR.
  try {
    var own = document.querySelector('meta[name="nexy-router"]');
    document.documentElement.dataset.router =
      (own && own.content) || localStorage.getItem("nexy-docs-router") || "fbr";
  } catch (e) { document.documentElement.dataset.router = "fbr"; }
  // The pages this browser has already read: read before the menu is painted, never after.
  try {
    document.documentElement.dataset.seen = localStorage.getItem("nexy-docs-seen") || "";
  } catch (e) {}
</script>
</head>
<body data-root="$root" data-search="$root/$search_index" data-i18n="$root/assets/i18n.json"$home_attr>
<a class="skip" href="#content" data-i18n="skip">Skip to content</a>
<div class="shell">
  <header class="mobilebar">
    <button class="menu" type="button" aria-label="Open the menu" aria-expanded="false" data-i18n-aria="open_menu">$icon_menu</button>
    <a class="brand" href="$home" aria-label="Nexy, home" data-i18n-aria="home_aria">
      <img class="brand-logo" src="$root/assets/nexy.svg" alt="Nexy">
    </a>
    <button class="search-open" type="button" aria-label="Search the docs" data-i18n-aria="search_aria">$icon_search</button>
  </header>
  <nav class="side" aria-label="Documentation" data-i18n-aria="nav_aria">
    <div class="side-top">
      <div class="side-brand">
        <a class="brand" href="$home" aria-label="Nexy, home" data-i18n-aria="home_aria">
          <img class="brand-logo" src="$root/assets/nexy.svg" alt="Nexy">
        </a>
        <span class="side-version" aria-label="Nexy $version">$version</span>
        <button class="side-toggle" type="button" aria-label="Collapse the menu" aria-expanded="true" data-i18n-aria="collapse_menu">$icon_sidebar</button>
      </div>
      $area_select
      <button class="search-open" type="button" aria-label="Search the docs" data-i18n-aria="search_aria">
        $icon_search<span data-i18n="search">Search</span><kbd>Ctrl K</kbd>
      </button>
    </div>
    <div class="side-scroll">
      $nav
    </div>
  </nav>
  <script>
    // The menu is dimmed as it is parsed, before the browser shows it: a page this browser has
    // already read never paints bright and then fades, and a reader without JS sees every link.
    try {
      var read = (document.documentElement.dataset.seen || "").split(",");
      var slugOf = function (path) {
        var parts = path.split("/").filter(Boolean);
        var at = parts.indexOf("docs");
        // A translated page is the same page as the English one: /docs/fr/x/ reads as x.
        if (at >= 0 && parts[at + 1] === document.documentElement.lang) at += 1;
        return at < 0 ? "" : parts.slice(at + 1).join("/");
      };
      document.querySelectorAll(".side .group a").forEach(function (link) {
        if (read.indexOf(slugOf(link.pathname)) >= 0) link.classList.add("seen");
      });
    } catch (e) {}
  </script>
  <div class="panel">
    <div class="panel-bar">
      <button class="side-toggle bar-open" type="button" aria-label="Open the menu" aria-expanded="false" data-i18n-aria="open_menu">$icon_sidebar</button>
      <span class="progress" aria-hidden="true"></span>
      $language_select
      <a class="bar-link" href="https://github.com/NexyPy/nexy" target="_blank" rel="noopener noreferrer" aria-label="Nexy on GitHub" data-i18n-aria="github_aria">$icon_github</a>
      <button class="theme-switch" type="button" role="switch" aria-checked="false" aria-label="Switch between light and dark" data-i18n-aria="theme" data-theme-toggle>
        <span class="theme-knob">$icon_sun$icon_moon</span>
      </button>
    </div>
    <div class="panel-body">
      <main class="page" id="content" tabindex="-1">
        <article class="$article_class">
          <p class="crumb"><a href="$home" data-i18n="docs">Docs</a><span aria-hidden="true">/</span>$section</p>
          $lang_note
          $article
          <p class="source">
            <button class="copy-page" type="button" data-markdown="index.md" data-i18n="copy_page">Copy page as Markdown</button>
            <a href="$source" data-i18n="edit_github">Edit on GitHub</a>
          </p>
          $pager
        </article>
      </main>
      <aside class="toc" aria-label="On this page" data-i18n-aria="on_this_page">$toc</aside>
    </div>
  </div>
</div>
<div class="scrim"></div>
<dialog class="search" aria-label="Search" data-i18n-aria="search">
  <form method="dialog"><input type="search" placeholder="Search the docs" aria-label="Search the docs" autocomplete="off" data-i18n-placeholder="search_aria" data-i18n-aria="search_aria"></form>
  <ul class="results" role="listbox"></ul>
  <p class="hint" data-i18n="enter_hint">Enter opens the result, Esc closes.</p>
</dialog>
<script src="$root/assets/site.js" defer></script>
</body>
</html>
