<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found - Nexy</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0a8f9b">
<link rel="icon" href="${base}assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="${base}assets/style.css">
<script>
  try {
    var saved = localStorage.getItem("nexy-docs-theme");
    var dark = saved ? saved === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
    document.documentElement.dataset.theme = dark ? "dark" : "light";
  } catch (e) { document.documentElement.dataset.theme = "light"; }
</script>
</head>
<body>
<header class="top">
  <a class="brand" href="${base}docs/">
    <span class="logo" aria-hidden="true">$mark</span><span class="name">Nexy</span><span class="tag">Docs</span>
  </a>
</header>
<main class="lost">
  <p class="crumb">404</p>
  <h1>This page does not exist</h1>
  <p>The address may be mistyped, or the page may have moved. The documentation is organised in sections: start from the overview and pick the topic you need.</p>
  <p><a class="button" href="${base}docs/">Open the documentation</a></p>
</main>
</body>
</html>
