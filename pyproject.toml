[project]
name = "nexy"
version = "2.1.1"
description = "The Modern Fullstack Python Meta-Framework: Build high-performance web apps ."
readme = "README.md"
requires-python = ">=3.12"
keywords = [
    "python", "fastapi", "fullstack", "meta-framework", "vite", "react", "vue", "svelte", "solid", "jinja2", 
    "ssr", "web-development", "nextjs-alternative", "astro-alternative", "modern-web", "dx", 
    "frontend-agnostic", "python-ssr", "vite-python", "web-framework"
]

dependencies = [
    "cmarkgfm>=2024.1.4",
    "fastapi>=0.128.0",
    "jinja2>=3.1.6",
    "pygments>=2.20.0",
    "questionary>=2.1.1",
    "scalar-fastapi>=1.8.2",
    "typer>=0.21.1",
    "uvicorn[standard]>=0.40.0",
    "watchdog>=6.0.0",
]

[dependency-groups]
dev = [
    "deep-translator>=1.11.0",
    "mypy>=1.19.1",
    "pytest>=9.0.2",
    "ruff>=0.14.11",
    "types-jinja2>=2.11.9",
]

[project.scripts]
nx = "nexy.cli:CLI"
nexy = "nexy.cli:CLI"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
include = [
    "/nexy",
]

[tool.hatch.build.targets.wheel]
packages = ["nexy"]
exclude = ["nexy/templates/tests"]

[tool.mypy]
strict = true
files = "nexy"

[[tool.mypy.overrides]]
module = "nexyconfig"
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "ARG"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: performance/regression benchmarks (nightly, excluded from fast CI lane)",
]

[tool.uv.workspace]
members = []
