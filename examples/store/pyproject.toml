[project]
name = "store"
version = "0.1.0"
description = "Good Stock, a shop in Vue whose cart and orders live in SQLite behind Nexy actions"
dependencies = [
    "nexy>=2.8.0",
    "sqlalchemy",
    "alembic",
    "python-dotenv",
]
requires-python = ">=3.12"

[dependency-groups]
dev = ["pytest>=9.0.2", "httpx>=0.28.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
extend-exclude = ["alembic"]

[tool.ruff.lint]
extend-select = ["I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Nexy reads its settings as attributes of the class, dicts included.
"nexyconfig.py" = ["RUF012"]

[tool.ruff.lint.isort]
# alembic/ holds the migrations, not the package: without this, ruff takes it for project code.
known-first-party = ["src"]
known-third-party = ["alembic"]
