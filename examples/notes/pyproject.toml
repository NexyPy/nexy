[project]
name = "notes"
version = "0.1.0"
description = "A Nexy web application with svelte components"
dependencies = [
    "nexy>=2.8.0",
    "tortoise-orm",
    "aerich",
    "python-dotenv",
]
requires-python = ">=3.12"

[tool.tortoise]
tortoise_orm = "src.configs.db.TORTOISE_ORM"
location = "./migrations"
src_folder = "./."
