[project]
name = "chat"
version = "0.1.0"
description = "A team chat: rooms drawn by the server, a form that works without JavaScript, live with Preact"
dependencies = [
    "nexy>=2.8.0",
]
requires-python = ">=3.12"

[dependency-groups]
dev = ["pytest>=9.0.2", "httpx>=0.28.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
extend-select = ["I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.ruff.lint.per-file-ignores]
# Nexy reads its settings as attributes of the class.
"nexyconfig.py" = ["RUF012"]
